# Testa e publica no GitHub Pages a cada push na main.
name: Testar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testes de unidade
        run: node --test
      - name: Teste no Chrome headless
        run: node tests/browser-smoke.mjs /tmp/shots
      # Só o app: sem testes, sem o código-fonte do wasm.
      - run: mkdir _site && cp -r index.html manifest.webmanifest sw.js css js icons fonts _site/
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

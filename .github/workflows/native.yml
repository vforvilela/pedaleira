# Apps nativos (Capacitor): APK de teste e AAB para a Play Store no Ubuntu; no macOS, confere que o projeto
# iOS compila (sem assinatura: a conta Apple do dono assina e publica pelo Xcode ou pelo Transporter).
name: Apps Android e iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # anexar o APK à release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run www && npx cap sync android
      # Chave de upload (secrets ANDROID_KEYSTORE_BASE64, _PASSWORD, _ALIAS, KEY_PASSWORD; ver README): com ela o AAB
      # e o APK de release saem assinados. Sem os secrets, só o APK de debug e um AAB sem assinatura.
      - id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "file=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # APK de debug: instala direto no celular (adb install ou pelo navegador). AAB: o que a Play Store recebe.
      - run: cd android && ./gradlew --no-daemon assembleDebug bundleRelease ${{ steps.keystore.outputs.file != '' && 'assembleRelease' || '' }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1-dev' }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: tonesmith-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      # Em tag: o APK vai para a página de releases do GitHub, para instalar sem loja (Android aceita APK de
      # fora com um aviso). Com a chave de upload é o APK de release; sem ela, o de debug.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/${{ steps.keystore.outputs.file != '' && 'release/app-release' || 'debug/app-debug' }}.apk tonesmith-${{ github.ref_name }}.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tonesmith-${{ github.ref_name }}.apk
          generate_release_notes: true
          # v0.x é pré-lançamento: aparece marcado como "Pre-release" na página.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run www && npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -40
